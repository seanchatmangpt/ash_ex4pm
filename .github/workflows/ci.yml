name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix verify (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-24.04
    env:
      # OTP TLS on this runner can reject the served certificate chain when
      # RustlerPrecompiled fetches native artifacts. Reuse the runner's
      # system CA bundle instead of changing package/runtime semantics.
      HEX_CACERTS_PATH: /etc/ssl/certs/ca-certificates.crt
      # Explorer's RustlerPrecompiled download hits the same OTP TLS edge;
      # compile that one NIF locally instead of depending on release-assets TLS.
      EXPLORER_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27.1"
            elixir: "1.17.3"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          # builds.hex.pm currently serves a cert OTP's TLS rejects
          # (key_usage_mismatch); bootstrap hex/rebar3 from GitHub instead.
          install-hex: false
          install-rebar: false

      - name: Bootstrap hex and rebar3
        run: |
          mix archive.install github hexpm/hex branch latest --force
          curl -fsSL -o /usr/local/bin/rebar3 https://github.com/erlang/rebar3/releases/latest/download/rebar3
          chmod +x /usr/local/bin/rebar3
          rebar3 --version
          # Mix ignores PATH for rebar3; it honors MIX_REBAR3 (or its own
          # mix_home copy, which can only be fetched from the broken mirror).
          echo "MIX_REBAR3=/usr/local/bin/rebar3" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify (format, compile --warnings-as-errors, test)
        run: mix verify
