name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix verify (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-24.04
    env:
      # OTP TLS on this runner can reject the served certificate chain when
      # RustlerPrecompiled fetches native artifacts. Reuse the runner's
      # system CA bundle instead of changing package/runtime semantics.
      HEX_CACERTS_PATH: /etc/ssl/certs/ca-certificates.crt
      # RustlerPrecompiled consumes the exact locked Explorer NIF from this
      # pre-populated cache, avoiding OTP :httpc's release-assets TLS edge.
      RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: /tmp/rustler_precompiled
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27.1"
            elixir: "1.17.3"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          # builds.hex.pm currently serves a cert OTP's TLS rejects
          # (key_usage_mismatch); bootstrap hex/rebar3 from GitHub instead.
          install-hex: false
          install-rebar: false

      - name: Bootstrap hex and rebar3
        run: |
          mix archive.install github hexpm/hex branch latest --force
          curl -fsSL -o /usr/local/bin/rebar3 https://github.com/erlang/rebar3/releases/latest/download/rebar3
          chmod +x /usr/local/bin/rebar3
          rebar3 --version
          # Mix ignores PATH for rebar3; it honors MIX_REBAR3 (or its own
          # mix_home copy, which can only be fetched from the broken mirror).
          echo "MIX_REBAR3=/usr/local/bin/rebar3" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Prefetch locked Explorer NIF
        run: |
          mkdir -p "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH"
          curl -fL --retry 3 --retry-all-errors \
            -o "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH/libexplorer-v0.13.0-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz" \
            "https://github.com/elixir-nx/explorer/releases/download/v0.13.0/libexplorer-v0.13.0-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz"
          curl -fL --retry 3 --retry-all-errors \
            -o "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH/libwasmex-v0.15.1-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz" \
            "https://github.com/tessi/wasmex/releases/download/v0.15.1/libwasmex-v0.15.1-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz"

      - name: Verify (format, compile --warnings-as-errors, test)
        run: mix verify
